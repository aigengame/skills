name: Release catalog

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SKILLS_CLI_VERSION: "1.5.23"
  SMOKE_SKILL: artifact-review

jobs:
  candidate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6

      - name: Record the exact candidate revision
        id: candidate
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          if [ "$candidate_sha" != "$GITHUB_SHA" ]; then
            echo "Checked out ${candidate_sha}, expected ${GITHUB_SHA}." >&2
            exit 1
          fi
          echo "sha=${candidate_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused tests
        run: python -m unittest discover -s tests -v

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: List every skill with the pinned Skills CLI
        run: |
          list_output="${RUNNER_TEMP}/candidate-skills-list.txt"
          npx --yes "skills@${SKILLS_CLI_VERSION}" add . --list | tee "$list_output"
          python scripts/validate_skills_cli_list.py "$list_output"

      - name: Validate an isolated project installation
        run: |
          project_root="${RUNNER_TEMP}/skills-project"
          mkdir -p "$project_root"
          git -C "$project_root" init --quiet
          (
            cd "$project_root"
            npx --yes "skills@${SKILLS_CLI_VERSION}" add "$GITHUB_WORKSPACE" \
              --skill "$SMOKE_SKILL" --agent codex --copy -y
          )
          installed_root="${project_root}/.agents/skills"
          diff -ru "skills/${SMOKE_SKILL}" "${installed_root}/${SMOKE_SKILL}"
          test "$(find "$installed_root" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "1"
          for infrastructure in .github docs scripts tests; do
            test ! -e "${installed_root}/${infrastructure}"
          done

      - name: Validate an isolated global installation
        run: |
          global_root="${HOME}/.agents/skills"
          test ! -e "${global_root}/${SMOKE_SKILL}"
          npx --yes "skills@${SKILLS_CLI_VERSION}" add "$GITHUB_WORKSPACE" \
            --skill "$SMOKE_SKILL" --agent codex --global --copy -y
          diff -ru "skills/${SMOKE_SKILL}" "${global_root}/${SMOKE_SKILL}"
          for infrastructure in .github docs scripts tests; do
            test ! -e "${global_root}/${infrastructure}"
          done

  release:
    name: Run Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: candidate
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      validate: ${{ steps.release_target.outputs.validate }}
      sha: ${{ steps.release_target.outputs.sha }}
      tag: ${{ steps.release_target.outputs.tag }}
      version: ${{ steps.release_target.outputs.version }}

    steps:
      - name: Bind release creation to this validated revision
        id: release_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          associated_prs="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
          )"
          release_prs="$(
            jq --arg base "$GITHUB_REF_NAME" \
              '[.[] | select(
                .merged_at != null and
                .base.ref == $base and
                (.labels | map(.name) | any(
                  . == "autorelease: pending" or . == "autorelease: tagged"
                ))
              )]' <<< "$associated_prs"
          )"
          release_pr_count="$(jq 'length' <<< "$release_prs")"
          if [ "$release_pr_count" -gt 1 ]; then
            echo "Revision ${GITHUB_SHA} is associated with multiple release pull requests." >&2
            exit 1
          fi
          if [ "$release_pr_count" -eq 0 ]; then
            echo "mode=maintain" >> "$GITHUB_OUTPUT"
            echo "This is not a merged release pull request revision."
            exit 0
          fi

          release_pr_number="$(jq -r '.[0].number' <<< "$release_prs")"
          release_pr_sha="$(jq -r '.[0].merge_commit_sha' <<< "$release_prs")"
          if [ "$release_pr_sha" != "$GITHUB_SHA" ]; then
            echo "Release pull request #${release_pr_number} merged at ${release_pr_sha}, not ${GITHUB_SHA}." >&2
            exit 1
          fi

          has_pending="$(
            jq -r '.[0].labels | map(.name) | index("autorelease: pending") != null' \
              <<< "$release_prs"
          )"
          has_tagged="$(
            jq -r '.[0].labels | map(.name) | index("autorelease: tagged") != null' \
              <<< "$release_prs"
          )"
          if [ "$has_tagged" = "true" ]; then
            echo "mode=validate-existing" >> "$GITHUB_OUTPUT"
            echo "Validated revision ${GITHUB_SHA} is tagged release pull request #${release_pr_number}."
          elif [ "$has_pending" = "true" ]; then
            echo "mode=create" >> "$GITHUB_OUTPUT"
            echo "Validated revision ${GITHUB_SHA} is pending release pull request #${release_pr_number}."
          else
            echo "Release pull request #${release_pr_number} has no recognized release label." >&2
            exit 1
          fi

      - name: Create or update the release pull request
        if: steps.release_gate.outputs.mode == 'maintain'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Create the validated release
        if: steps.release_gate.outputs.mode == 'create'
        id: release
        continue-on-error: true
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Resolve the release validation target
        if: steps.release_gate.outputs.mode != 'maintain'
        id: release_target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTION_OUTCOME: ${{ steps.release.outcome }}
        run: |
          matching_releases="$(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -s --arg sha "$GITHUB_SHA" \
                '[.[][] | select(.target_commitish == $sha and .draft == false)]'
          )"
          matching_count="$(jq 'length' <<< "$matching_releases")"
          if [ "$matching_count" -ne 1 ]; then
            echo "Expected one non-draft release for ${GITHUB_SHA}, found ${matching_count}." >&2
            echo "Release Please outcome: ${RELEASE_ACTION_OUTCOME:-not-run}." >&2
            exit 1
          fi

          release_tag="$(jq -r '.[0].tag_name' <<< "$matching_releases")"
          if [[ ! "$release_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag ${release_tag} is not a full v-prefixed SemVer tag." >&2
            exit 1
          fi
          release_sha="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${release_tag}" \
              --jq .sha
          )"
          if [ "$release_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag ${release_tag} resolves to ${release_sha}, not ${GITHUB_SHA}." >&2
            exit 1
          fi

          echo "validate=true" >> "$GITHUB_OUTPUT"
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          echo "Release ${release_tag} is ready for tagged validation at ${release_sha}."

  tagged-release:
    name: Validate tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - candidate
      - release
    if: needs.release.outputs.validate == 'true'
    permissions:
      contents: write
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}

    steps:
      - name: Checkout the emitted tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}

      - name: Verify the tag resolves to the validated candidate
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$RELEASE_TAG" != "v${RELEASE_VERSION}" ]; then
            echo "Tag ${RELEASE_TAG} does not match version ${RELEASE_VERSION}." >&2
            exit 1
          fi
          if [ "$checkout_sha" != "$RELEASE_SHA" ] || \
             [ "$tag_sha" != "$RELEASE_SHA" ] || \
             [ "$RELEASE_SHA" != "$CANDIDATE_SHA" ]; then
            echo "Release tag, release output, and validated candidate do not resolve to one revision." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: List skills from the emitted tag
        run: |
          release_source="${GITHUB_REPOSITORY}#${RELEASE_TAG}"
          list_output="${RUNNER_TEMP}/tagged-skills-list.txt"
          npx --yes "skills@${SKILLS_CLI_VERSION}" add "$release_source" --list | tee "$list_output"
          python scripts/validate_skills_cli_list.py "$list_output"

      - name: Install a skill from the emitted tag
        run: |
          project_root="${RUNNER_TEMP}/tagged-skills-project"
          release_source="${GITHUB_REPOSITORY}#${RELEASE_TAG}"
          mkdir -p "$project_root"
          git -C "$project_root" init --quiet
          (
            cd "$project_root"
            npx --yes "skills@${SKILLS_CLI_VERSION}" add "$release_source" \
              --skill "$SMOKE_SKILL" --agent codex --copy -y
          )
          installed_root="${project_root}/.agents/skills"
          diff -ru "skills/${SMOKE_SKILL}" "${installed_root}/${SMOKE_SKILL}"
          test "$(find "$installed_root" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "1"
          for infrastructure in .github docs scripts tests; do
            test ! -e "${installed_root}/${infrastructure}"
          done

      - name: Record release validation metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- aigengame-skills-catalog-validation -->"
          release_body="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [[ "$release_body" == *"$marker"* ]]; then
            echo "Release validation metadata is already present."
            exit 0
          fi
          validation_notes="$(printf '\n\n%s\n## Catalog validation\n\n- Catalog tag: `%s`\n- Catalog revision: `%s`\n- Skills CLI: `skills@%s`\n- Verified install: `npx skills@%s add %s#%s`\n' \
            "$marker" "$RELEASE_TAG" "$RELEASE_SHA" "$SKILLS_CLI_VERSION" \
            "$SKILLS_CLI_VERSION" "$GITHUB_REPOSITORY" "$RELEASE_TAG")"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "${release_body}${validation_notes}"
